<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PAGE TITLE -->
  <!-- Format: Project Name (Year) – Your Name -->
  <title>Chimp Champ Chomp (2022) – Holden Denyer</title>

  <link href="CSS/style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div class="container">

    <!-- ===================== -->
    <!-- BANNER (Site-wide) -->
    <!-- ===================== -->
    <header id="banner">
      <div class="banner-wrapper">

        <!-- Animated or static banner image -->
        <img src="IMG/BannerTemp.png"
             alt="Animated Banner"
             class="banner-gif">

        <!-- Decorative frame that scales with banner -->
        <img src="IMG/BannerFrame.png"
             alt="Banner Frame"
             class="banner-frame">

      </div>
    </header>

    <!-- ===================== -->
    <!-- DIRECTORY / NAV BUTTONS -->
    <!-- ===================== -->
    <nav class="project-nav">

      <!-- Link back to parent skill page -->
      <!-- Example: unity.html, web.html, adobe.html -->
      <a href="web.html" class="back-button">← Web Design</a>

      <!-- Link back to main gallery / home -->
      <a href="index.html" class="back-button">Gallery</a>

    </nav>

    <!-- ===================== -->
    <!-- PROJECT HEADER -->
    <!-- ===================== -->
    <section class="project-header">

      <!-- PROJECT TITLE -->
      <h1>Chimp Champ Chomp</h1>

      <!-- SHORT DESCRIPTOR -->
      <!-- Example: Unity • Arduino • Installation -->
      <p class="project-subtitle">
        PRIMARY TOOL • SECONDARY TOOL • CONTEXT / THEME
      </p>

    </section>

    <!-- ===================== -->
    <!-- PROJECT OVERVIEW -->
    <!-- ===================== -->
    <section class="project-overview">

      <h2>Overview</h2>

      <p>
        This project explores [CORE IDEA OR QUESTION].
        It was created using [TOOLS / SOFTWARE / MEDIA]
        and focuses on [INTERACTION, DESIGN GOAL, OR CONCEPT].
      </p>

    </section>

    <!-- ===================== -->
    <!-- CAROUSEL TRIGGER -->
    <!-- ===================== -->
    <!-- Single framed image that opens the full carousel -->
    <section class="project-carousel-trigger">

      <div class="carousel-frame-wrapper carousel-trigger"

        data-images=""
        data-captions=""
      >
        <img
          src="portfolio/web/chimp/chimp.png"
          alt="Project Preview Image"
          class="carousel-trigger-image"
        >

        <!-- FRAME OVERLAY -->
        <a href="portfolio/web/chimp/index.html">
        <img
          src="IMG/CarouselFrame.png"
          alt="Carousel Frame"
          class="carousel-frame"
        >
        </a>

      </div>

      <!-- Optional helper text -->
      <p class="carousel-hint">
        Click image to view gallery
      </p>

    </section>

  </div>

  <!-- ===================== -->
  <!-- CAROUSEL MODAL -->
  <!-- ===================== -->
  <!-- Hidden until triggered -->
  <div id="carousel-modal" class="carousel-modal">

    <!-- Close button -->
    <span class="carousel-close">&times;</span>

    <div class="carousel-content">

      <!-- Left arrow -->
      <button class="carousel-arrow left">‹</button>

      <!-- Image + caption container -->
      <div class="carousel-image-wrapper">

        <!-- Active carousel image -->
        <img class="carousel-image" src="" alt="">

        <!-- Caption for active image -->
        <p class="carousel-caption"></p>

      </div>

      <!-- Right arrow -->
      <button class="carousel-arrow right">›</button>

    </div>
  </div>

  <!-- ===================== -->
  <!-- CAROUSEL SCRIPT -->
  <!-- ===================== -->
  <script src="JS/carousel.js"></script>

</body>
</html>
