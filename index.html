<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>holdendenyer.com</title>
  <link href="CSS/style.css" rel="stylesheet" type="text/css"/>
</head>

<body>
  <div class="container">

    <!-- Banner -->
    <header id="banner">
      <div class="banner-wrapper">
        <img src="IMG/sketch.gif" alt="Animated Banner" class="banner-gif">
        <img src="IMG/BannerFrame.png" alt="Banner Frame" class="banner-frame">
      </div>
    </header>

    <!-- Welcome -->
    <section class="welcome-section">
      <img src="IMG/Welcome2.png" alt="Welcome to HOLDENDENYER.com" class="responsive-img">
    </section>

    <!-- MAIN MENU -->
    <nav class="main-menu">
      <a href="#gallery">GALLERY</a>
      <a href="#skills">SKILLS</a>
      <a href="#about">ABOUT</a>
    </nav>

    <!-- Gallery -->
    <section id="gallery" class="gallery-wall">
      <!-- Row 1 -->
      <div class="gallery-item small tall">
        <img src="IMG/TwoFrame.png" alt="Small Frame" class="responsive-img">
      </div>
      <div class="gallery-item small">
        <img src="IMG/TallFrame.png" alt="Small Frame" class="responsive-img">
      </div>
      <div class="gallery-item large">
        <a href="unity-maze-blobber.html">
          <img src="IMG/Frame3.png" alt="Maze Blobber" class="responsive-img">
        </a>
      </div>

      <!-- Row 2 -->
      <div class="gallery-item wide">
        <img src="IMG/WideFrame3.png" alt="Wide Frame" class="responsive-img">
      </div>
      <div class="gallery-item small">
        <img src="IMG/Frame2.png" alt="Small Frame" class="responsive-img">
      </div>
      <div class="gallery-item small">
        <img src="IMG/Frame1.png" alt="Small Frame" class="responsive-img">
      </div>

      <!-- Row 3 -->
      <div class="gallery-item large">
        <img src="IMG/Frame1.png" alt="Large Frame" class="responsive-img">
      </div>
      <div class="gallery-item large">
        <img src="IMG/ThreeFrame.png" alt="Large Frame" class="responsive-img">
      </div>

      <!-- Row 4 -->
      <div class="gallery-item large">
        <img src="IMG/Frame2.png" alt="Large Frame" class="responsive-img">
      </div>
      <div class="gallery-item small tall">
        <img src="IMG/TallFrame3.png" alt="Small Frame" class="responsive-img">
      </div>
      <div class="gallery-item small tall">
        <img src="IMG/TallFrame.png" alt="Small Frame" class="responsive-img">
      </div>
    </section>

    <!-- SKILLS MENU -->
    <section id="skills" class="skills-menu">
      <a href="unity.html" class="skills-button">UNITY</a>
      <a href="touchdesigner.html" class="skills-button">TOUCHDESIGNER</a>
      <a href="web.html" class="skills-button">WEB DESIGN</a>
      <a href="photography.html" class="skills-button">PHOTOGRAPHY</a>
    </section>

    <!-- About -->
    <section id="about">
      <img src="IMG/About_frame.png" alt="About" class="responsive-img">
    </section>

  </div>
</body>

<!-- Footer -->
<footer class="site-footer">
  <p>© 2026 Holden Denyer. All rights reserved.</p>
</footer>

</html>
